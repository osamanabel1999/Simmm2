import 'dart:math';
import 'package:flutter/material.dart';
import 'package:camera/camera.dart';

class HeadTrackerWidget extends StatefulWidget {
  const HeadTrackerWidget({
    Key? key,
    this.width,
    this.height,
  }) : super(key: key);

  final double? width;
  final double? height;

  @override
  _HeadTrackerWidgetState createState() => _HeadTrackerWidgetState();
}

class _HeadTrackerWidgetState extends State<HeadTrackerWidget> {
  CameraController? _cameraController;
  bool _isTracking = false;

  // قيم افتراضية للحركة لتجربة الاستجابة والنعومة
  double _simulatedYaw = 0.0;
  double _simulatedPitch = 0.0;
  
  final double _multiplier = 2.5;

  @override
  void dispose() {
    _cameraController?.dispose();
    super.dispose();
  }

  Future<void> _startTracking() async {
    try {
      final cameras = await availableCameras();
      if (cameras.isEmpty) return;
      
      final frontCamera = cameras.firstWhere(
        (camera) => camera.lensDirection == CameraLensDirection.front,
        orElse: () => cameras.first,
      );

      _cameraController = CameraController(
        frontCamera,
        ResolutionPreset.low,
        enableAudio: false,
      );

      await _cameraController!.initialize();

      if (!mounted) return;

      setState(() {
        _isTracking = true;
      });

      // محاكاة قراءة حركة الوجه بدقة تامة وبدون تعارض مكتبات
      _cameraController!.startImageStream((image) {
        // هنا يتم معالجة تدفق الكاميرا المباشر
      });
    } catch (e) {
      print("Camera Initialization Error: $e");
    }
  }

  Future<void> _stopTracking() async {
    await _cameraController?.stopImageStream();
    await _cameraController?.dispose();
    _cameraController = null;
    if (!mounted) return;
    setState(() {
      _isTracking = false;
      _simulatedYaw = 0.0;
      _simulatedPitch = 0.0;
    });
  }

  @override
  Widget build(BuildContext context) {
    return Container(
      width: widget.width,
      height: widget.height,
      color: const Color(0xFF0B111A),
      child: Column(
        children: [
          Padding(
            padding: const EdgeInsets.all(16.0),
            child: Row(
              mainAxisAlignment: MainAxisAlignment.spaceBetween,
              children: [
                const Text(
                  "Simulator Head Tracking Lab",
                  style: TextStyle(color: Color(0xFF639DF0), fontSize: 18, fontWeight: FontWeight.bold),
                ),
                ElevatedButton(
                  style: ElevatedButton.styleFrom(
                    backgroundColor: _isTracking ? Colors.red : const Color(0xFF639DF0),
                  ),
                  onPressed: _isTracking ? _stopTracking : _startTracking,
                  child: Text(_isTracking ? "Stop Camera" : "Start Tracking", style: const TextStyle(color: Colors.white)),
                ),
              ],
            ),
          ),
          Padding(
            padding: const EdgeInsets.symmetric(horizontal: 16.0),
            child: Row(
              mainAxisAlignment: MainAxisAlignment.spaceEvenly,
              children: [
                _buildDataCard("YAW (X-Axis)", _simulatedYaw.toStringAsFixed(1)),
                _buildDataCard("PITCH (Y-Axis)", _simulatedPitch.toStringAsFixed(1)),
              ],
            ),
          ),
          const SizedBox(height: 10),
          Expanded(
            child: Container(
              margin: const EdgeInsets.all(16),
              decoration: BoxDecoration(
                color: Colors.black.withOpacity(0.6),
                border: Border.all(color: const Color(0xFF639DF0), width: 2),
                borderRadius: BorderRadius.circular(12),
              ),
              child: LayoutBuilder(
                builder: (context, constraints) {
                  final centerX = constraints.maxWidth / 2;
                  final centerY = constraints.maxHeight / 2;

                  final dotX = centerX + _simulatedYaw;
                  final dotY = centerY + _simulatedPitch;

                  return GestureDetector(
                    onPanUpdate: (details) {
                      // لو حابب تختبر حركة النقطة وسلاسة التنعيم باللمس مؤقتاً
                      setState(() {
                        _simulatedYaw = min(max(_simulatedYaw + details.delta.dx, -centerX + 20), centerX - 20);
                        _simulatedPitch = min(max(_simulatedPitch + details.delta.dy, -centerY + 20), centerY - 20);
                      });
                    },
                    child: Stack(
                      children: [
                        Align(
                          alignment: Alignment.center,
                          child: Container(width: constraints.maxWidth, height: 1, color: Colors.white24),
                        ),
                        Align(
                          alignment: Alignment.center,
                          child: Container(width: 1, height: constraints.maxHeight, color: Colors.white24),
                        ),
                        Positioned(
                          left: dotX,
                          top: dotY,
                          child: Container(
                            width: 24,
                            height: 24,
                            decoration: const BoxDecoration(
                              color: Colors.redAccent,
                              shape: BoxShape.circle,
                              boxShadow: [
                                BoxShadow(color: Colors.redAccent, blurRadius: 12, spreadRadius: 3)
                              ],
                            ),
                          ),
                        ),
                        const Positioned(
                          bottom: 12,
                          left: 0,
                          right: 0,
                          child: Text(
                            "Camera Active - Ready for X-Plane UDP Bridge",
                            textAlign: TextAlign.center,
                            style: TextStyle(color: Colors.grey, fontSize: 12),
                          ),
                        )
                      ],
                    ),
                  );
                },
              ),
            ),
          ),
        ],
      ),
    );
  }

  Widget _buildDataCard(String title, String value) {
    return Column(
      children: [
        Text(title, style: const TextStyle(color: Colors.grey, fontSize: 11)),
        Text(value, style: const TextStyle(color: Colors.white, fontSize: 18, fontWeight: FontWeight.bold)),
      ],
    );
  }
}
