plugins {
   id "com.android.application"
   id "kotlin-android"
   id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.captain.simulatorfly"
    compileSdkVersion 36
    ndkVersion "28.2.13676358"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    lintOptions {
        disable 'InvalidPackage'
        checkReleaseBuilds false
    }

    defaultConfig {
        applicationId "com.captain.simulatorfly"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

   signingConfigs {
       release {
           // تم التعديل هنا لسحب بيانات التوقيع من كود ماجيك مباشرة
           keyAlias System.getenv("CM_KEY_ALIAS") ?: keystoreProperties['keyAlias']
           keyPassword System.getenv("CM_KEY_PASSWORD") ?: keystoreProperties['keyPassword']
           
           def cmKeystorePath = System.getenv("CM_KEYSTORE_PATH")
           if (cmKeystorePath != null) {
               storeFile file(cmKeystorePath)
           } else if (keystoreProperties['storeFile'] != null) {
               storeFile file(keystoreProperties['storeFile'])
           }
           
           storePassword System.getenv("CM_KEYSTORE_PASSWORD") ?: keystoreProperties['storePassword']
       }
   }

    buildTypes {
        release {
            // تم التعديل هنا لتفعيل توقيع الريليز بدل الديباج
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.2.20"
}
